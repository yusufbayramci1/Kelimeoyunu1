<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ateş & Su 3D - Tapınak Online</title>
  <!-- Three.js Gerçek 3D WebGL Motoru -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Firebase Realtime Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08070c;
      color: #f6f2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Tam Ekran 3D WebGL Sahnesi (Hem Menüde Hem Oyunda Canlı) */
    #viewport3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* --- ANA MENÜ & BEKLEME ODASI --- */
    #lobbyOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 45%, rgba(10, 8, 16, 0.18) 0%, rgba(8, 7, 12, 0.82) 100%);
      overflow-y: auto;
    }

    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nick-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 13, 24, 0.78);
      border: 1px solid rgba(255, 213, 79, 0.3);
      border-radius: 999px;
      padding: 5px 12px;
      backdrop-filter: blur(10px);
    }

    .nick-wrap input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      width: 112px;
      outline: none;
      touch-action: manipulation;
      user-select: text;
      -webkit-user-select: text;
    }

    .online-pill {
      font-size: 11px;
      font-weight: 800;
      color: #69f0ae;
      background: rgba(16, 13, 24, 0.78);
      border: 1px solid rgba(105, 240, 174, 0.3);
      border-radius: 999px;
      padding: 6px 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    .hero-title {
      text-align: center;
      margin: 6px 0;
    }

    .hero-badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 900;
      color: #ffd54f;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 213, 79, 0.35);
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .hero-title h1 {
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.05;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.9));
    }
    .t-fire {
      background: linear-gradient(180deg, #fff176 0%, #ff7043 45%, #d84315 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .t-amp { color: #ffd54f; font-size: 0.7em; margin: 0 4px; }
    .t-water {
      background: linear-gradient(180deg, #e1f5fe 0%, #4fc3f7 45%, #0277bd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      width: 100%;
      max-width: 430px;
      background: linear-gradient(180deg, rgba(28, 23, 39, 0.84), rgba(13, 11, 20, 0.92));
      border: 1px solid rgba(255, 213, 79, 0.26);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
    }

    /* Menü Sekmeleri */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: rgba(0, 0, 0, 0.42);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: #aaa0b8;
      font-size: 12px;
      font-weight: 800;
      padding: 9px 6px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: linear-gradient(180deg, #433757, #2b2338);
      color: #ffd54f;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }

    .tab-pane { display: none; flex-direction: column; gap: 10px; }
    .tab-pane.active { display: flex; }

    /* 3D Butonlar */
    .btn {
      width: 100%;
      padding: 13px 15px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s, filter 0.15s;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }
    .btn:active:not(:disabled) { transform: translateY(2px) scale(0.985); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; filter: grayscale(0.45); }

    .btn-match {
      background: linear-gradient(135deg, #ff6d2e 0%, #8e24aa 50%, #0288d1 100%);
      box-shadow: 0 5px 0 #2e1040, 0 10px 22px rgba(142, 36, 170, 0.35);
      padding: 15px;
      font-size: 16px;
    }
    .btn-fire {
      background: linear-gradient(180deg, #ff7043, #d84315);
      box-shadow: 0 4px 0 #7a1c05;
    }
    .btn-water {
      background: linear-gradient(180deg, #29b6f6, #0277bd);
      box-shadow: 0 4px 0 #013d63;
    }
    .btn-start {
      background: linear-gradient(180deg, #ffd54f, #ff8f00);
      box-shadow: 0 4px 0 #8a4a00, 0 0 20px rgba(255, 160, 0, 0.4);
      color: #1c1205;
      text-shadow: none;
      font-size: 16px;
    }
    .btn-ready-off {
      background: linear-gradient(180deg, #455a64, #263238);
      box-shadow: 0 4px 0 #131a1d;
    }
    .btn-ready-on {
      background: linear-gradient(180deg, #00e676, #00a152);
      box-shadow: 0 4px 0 #005229, 0 0 20px rgba(0, 230, 118, 0.45);
      color: #062111;
      text-shadow: none;
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 13px;
      padding: 10px;
      box-shadow: none;
    }

    .join-row { display: flex; gap: 8px; }
    .code-input {
      flex: 1;
      padding: 11px;
      border-radius: 13px;
      border: 1px solid rgba(255, 213, 79, 0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #ffd54f;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      touch-action: manipulation;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Canlı Açık Odalar Listesi */
    .room-list {
      max-height: 175px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }
    .room-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .room-item-info { display: flex; flex-direction: column; gap: 2px; }
    .room-item-name { font-size: 14px; font-weight: 800; color: #fff; }
    .room-item-sub { font-size: 11px; color: #aaa0b8; }
    .btn-mini-join {
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      background: linear-gradient(180deg, #29b6f6, #0277bd);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .empty-list {
      text-align: center;
      font-size: 13px;
      color: #9e93ad;
      padding: 20px 10px;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 12px;
    }

    /* Bekleme Odası */
    .room-top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 213, 79, 0.25);
      border-radius: 14px;
      padding: 10px 12px;
      gap: 8px;
    }
    .room-code-big {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffd54f;
      user-select: text;
      -webkit-user-select: text;
    }
    .share-btn {
      border: none;
      background: rgba(255, 213, 79, 0.18);
      border: 1px solid rgba(255, 213, 79, 0.4);
      color: #ffd54f;
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .slot-card {
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 12px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .slot-card.fire-on { border-color: rgba(255, 112, 67, 0.8); background: rgba(255, 87, 34, 0.12); }
    .slot-card.water-on { border-color: rgba(79, 195, 247, 0.8); background: rgba(41, 182, 246, 0.12); }
    .slot-name { font-size: 13px; font-weight: 800; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .slot-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
    }
    .slot-badge.ready { background: rgba(0, 230, 118, 0.22); color: #69f0ae; }
    .slot-badge.host { background: rgba(255, 213, 79, 0.22); color: #ffd54f; }

    .level-picker {
      display: flex;
      gap: 6px;
    }
    .lvl-chip {
      flex: 1;
      padding: 8px 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.38);
      color: #bbb;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .lvl-chip.selected {
      background: rgba(255, 213, 79, 0.22);
      border-color: #ffd54f;
      color: #ffd54f;
    }

    #statusBar {
      font-size: 13px;
      font-weight: 700;
      color: #ffd54f;
      text-align: center;
      min-height: 20px;
      text-shadow: 0 2px 6px #000;
      max-width: 430px;
    }

    .radar-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 213, 79, 0.3);
      border-top-color: #ffd54f;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin-right: 6px;
      vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- OYUN HUD VE KONTROLLERİ --- */
    #gameHudOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    #hudTop {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      background: linear-gradient(180deg, rgba(8, 7, 12, 0.82), rgba(8, 7, 12, 0));
      font-size: 13px;
      font-weight: 800;
      gap: 6px;
    }
    .hud-group { display: flex; align-items: center; gap: 6px; }
    .hud-pill {
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(20, 16, 28, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .hud-pill.fire { border-color: rgba(255, 112, 67, 0.6); color: #ffab91; }
    .hud-pill.water { border-color: rgba(79, 195, 247, 0.6); color: #81d4fa; }
    .hud-icon-btn {
      background: rgba(20, 16, 28, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    #toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      background: rgba(14, 11, 20, 0.92);
      border: 1px solid rgba(255, 213, 79, 0.5);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }
    #toast.show { opacity: 1; }

    /* Multi-Touch Mobil Kontrol Çubuğu */
    #touchControls {
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 12px 18px calc(16px + env(safe-area-inset-bottom));
    }

    /* Kaydırılabilir Sol/Sağ Tek Pad (Parmak kayınca asla kesilmez) */
    #dpadPad {
      pointer-events: auto;
      display: flex;
      gap: 10px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(12, 10, 18, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
    }

    .pad-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.26);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.08));
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    .pad-btn.active {
      background: radial-gradient(circle at 35% 30%, rgba(255, 213, 79, 0.55), rgba(255, 112, 67, 0.35));
      border-color: #ffd54f;
      transform: scale(0.94);
    }

    .right-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .jump-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 213, 79, 0.75);
      background: radial-gradient(circle at 35% 30%, rgba(255, 193, 7, 0.42), rgba(255, 87, 34, 0.2));
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
    }
    .jump-btn.active {
      background: radial-gradient(circle at 35% 30%, rgba(255, 213, 79, 0.8), rgba(255, 87, 34, 0.55));
      transform: scale(0.92);
    }

    .switch-btn {
      display: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid rgba(206, 147, 216, 0.7);
      background: rgba(142, 36, 170, 0.4);
      color: #fff;
      font-size: 20px;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- GERÇEK 3D SAHNE -->
  <canvas id="viewport3d"></canvas>
  <div id="toast"></div>

  <!-- ANA MENÜ & BEKLEME ODASI -->
  <div id="lobbyOverlay">
    <div class="top-bar">
      <div class="nick-wrap">
        <span>👤</span>
        <input id="nickInput" maxlength="12" placeholder="Adın..." />
      </div>
      <div class="online-pill">
        <span class="dot-live"></span>
        <span id="openCountText">0 Açık Oda</span>
      </div>
    </div>

    <div class="hero-title">
      <div class="hero-badge">🔥 3D GERÇEKÇİ TAPINAK • ONLINE 💧</div>
      <h1><span class="t-fire">ATEŞ</span><span class="t-amp">&</span><span class="t-water">SU</span></h1>
    </div>

    <!-- MENÜ KARTI -->
    <div class="glass-card" id="menuCard">
      <div class="tabs">
        <button class="tab-btn active" data-tab="quick">⚡ Eşleştir</button>
        <button class="tab-btn" data-tab="rooms">🌐 Odalar</button>
        <button class="tab-btn" data-tab="private">🔒 Özel Oda</button>
      </div>

      <!-- SEKME 1: HIZLI EŞLEŞTİR -->
      <div class="tab-pane active" id="tab-quick">
        <button class="btn btn-match" id="btnQuickMatch">⚡ Rastgele Oyuncu Bul</button>
        <button class="btn btn-ghost" id="btnSolo">🎮 Tek Cihazda Test Et (Solo 3D)</button>
      </div>

      <!-- SEKME 2: CANLI AÇIK ODALAR -->
      <div class="tab-pane" id="tab-rooms">
        <div class="room-list" id="publicRoomList">
          <div class="empty-list">Açık oda aranıyor...</div>
        </div>
        <button class="btn btn-fire" id="btnCreatePublic">🔥 Herkese Açık Oda Aç</button>
      </div>

      <!-- SEKME 3: ÖZEL ODA -->
      <div class="tab-pane" id="tab-private">
        <button class="btn btn-fire" id="btnCreatePrivate">🔥 Özel Oda Kur (Kod + Link)</button>
        <div class="join-row">
          <input type="tel" maxlength="4" id="inputCode" class="code-input" placeholder="0000" />
          <button class="btn btn-water" id="btnJoinCode" style="width:auto; padding:0 18px;">💧 Katıl</button>
        </div>
      </div>
    </div>

    <!-- BEKLEME ODASI KARTI (HAZIR & BAŞLAT) -->
    <div class="glass-card" id="roomCard" style="display:none;">
      <div class="room-top-strip">
        <div>
          <div style="font-size:11px; color:#b3a7c2; font-weight:800;" id="roomTypeLabel">ÖZEL ODA</div>
          <div class="room-code-big" id="roomCodeDisplay">----</div>
        </div>
        <button class="share-btn" id="btnShareLink">🔗 Linki Kopyala</button>
      </div>

      <div class="slots-grid">
        <div class="slot-card fire-on" id="slotFire">
          <div style="font-size:28px;">🔥</div>
          <div class="slot-name" id="fireName" style="color:#ffab91;">Ateş</div>
          <div class="slot-badge host">Kurucu</div>
        </div>
        <div class="slot-card" id="slotWater">
          <div style="font-size:28px;">💧</div>
          <div class="slot-name" id="waterName" style="color:#81d4fa;">Bekleniyor...</div>
          <div class="slot-badge" id="waterBadge">Boş</div>
        </div>
      </div>

      <!-- Kurucu için Bölüm Seçici -->
      <div id="levelPickerWrap" style="display:none; flex-direction:column; gap:5px;">
        <div style="font-size:11px; color:#b3a7c2; font-weight:800;">BAŞLANGIÇ BÖLÜMÜ</div>
        <div class="level-picker">
          <button class="lvl-chip selected" data-lvl="0">1. Tapınak</button>
          <button class="lvl-chip" data-lvl="1">2. Köprüler</button>
          <button class="lvl-chip" data-lvl="2">3. Mahzen</button>
        </div>
      </div>

      <!-- Kurucu Başlat Butonu (Misafir hazır vermeden kilitli!) -->
      <button class="btn btn-start" id="btnStartGame" style="display:none;" disabled>
        ⏳ Su Oyuncusu Bekleniyor...
      </button>

      <!-- Misafir Hazır Butonu -->
      <button class="btn btn-ready-off" id="btnToggleReady" style="display:none;">
        ✋ Hazır Ver
      </button>

      <button class="btn btn-ghost" id="btnLeaveRoom">← Odadan Ayrıl</button>
    </div>

    <div id="statusBar">3D Tapınak hazır. Mobil veri ve Wi-Fi'da sorunsuz bağlanır.</div>
  </div>

  <!-- OYUN İÇİ HUD VE DOKUNMATİK KONTROLLER -->
  <div id="gameHudOverlay">
    <div id="hudTop">
      <div class="hud-group">
        <span class="hud-pill fire" id="rolePill">🔥 Ateş</span>
        <span class="hud-pill" id="levelPill">1. Tapınak</span>
      </div>
      <div class="hud-group">
        <span class="hud-pill" id="gemPill">💎 0/4</span>
        <button class="hud-icon-btn" id="btnMute">🔊</button>
        <button class="hud-icon-btn" id="btnRestart">↻</button>
        <button class="hud-icon-btn" id="btnExitGame">✕</button>
      </div>
    </div>

    <div id="touchControls">
      <div id="dpadPad">
        <div class="pad-btn" id="visualLeft">◀</div>
        <div class="pad-btn" id="visualRight">▶</div>
      </div>

        osc.start(now); osc.stop(now + dur + 0.02);

    // Taş duvarları havuz konumlarından fiziksel olarak oyup çukur teknesi üretir
    function carveWalls(walls, hazards) {
      const carved = [];
      for (const w of walls) {
        const pits = hazards
          .filter((h) => h.y === w.y && h.x >= w.x && h.x + h.w <= w.x + w.w)
          .sort((a, b) => a.x - b.x);
        if (!pits.length) {
          carved.push({ ...w, isPitFloor: false });
          continue;
        }
        let cursor = w.x;
        for (const p of pits) {
          if (p.x > cursor) {
            carved.push({ x: cursor, y: w.y, w: p.x - cursor, h: w.h, isPitFloor: false });
          }
          // Çukurun taban taşı (depth kadar aşağıda!)
          carved.push({
            x: p.x,
            y: w.y + p.depth,
            w: p.w,
            h: Math.max(8, w.h - p.depth),
            isPitFloor: true
          });
          cursor = p.x + p.w;
        }
        if (cursor < w.x + w.w) {
          carved.push({ x: cursor, y: w.y, w: w.x + w.w - cursor, h: w.h, isPitFloor: false });
        }
      }
      return carved;
    }

    // Prosedürel 3D Taş Dokusu + Kabartma Haritası (Harici dosya gerekmez)
    function makeStoneTextures(baseHex, mortarHex, moss) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = mortarHex;
      g.fillRect(0, 0, 256, 256);

      const b = document.createElement("canvas");
      b.width = 256; b.height = 256;
      const bg = b.getContext("2d");
      bg.fillStyle = "#181818";
      bg.fillRect(0, 0, 256, 256);

      const rows = 4, cols = 4;
      const bw = 256 / cols, bh = 256 / rows;
      for (let r = 0; r < rows; r++) {
        const off = (r % 2) * (bw / 2);
        for (let col = -1; col <= cols; col++) {
          const x = col * bw + off;
          const y = r * bh;
          const v = (Math.sin(r * 13 + col * 7) * 0.5 + 0.5) * 18 - 9;
          g.fillStyle = baseHex;
          g.fillRect(x + 3, y + 3, bw - 6, bh - 6);
          g.fillStyle = v > 0 ? `rgba(255,255,255,${v / 140})` : `rgba(0,0,0,${-v / 110})`;
          g.fillRect(x + 3, y + 3, bw - 6, bh - 6);
          // 3D taş kenar parıltısı
          g.fillStyle = "rgba(255,255,255,0.12)";
          g.fillRect(x + 3, y + 3, bw - 6, 3);
          g.fillStyle = "rgba(0,0,0,0.28)";
          g.fillRect(x + 3, y + bh - 6, bw - 6, 3);

          // Bump
          bg.fillStyle = "#d5d5d5";
          bg.fillRect(x + 4, y + 4, bw - 8, bh - 8);
        }
      }
      if (moss) {
        g.fillStyle = "rgba(62, 130, 74, 0.45)";
        g.fillRect(0, 0, 256, 12);
      }

      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      const bumpMap = new THREE.CanvasTexture(b);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      return { map, bumpMap };
    }

      // 1. Oyulmuş 3D Taş Duvarlar ve Platformlar
      for (const w of lvl.carvedWalls) {
        const bw = w.w / S, bh = w.h / S, bd = 4.6;
        const geo = new THREE.BoxGeometry(bw, bh, bd);
        const texCopy = wallTex.map.clone();
        texCopy.needsUpdate = true;
        texCopy.repeat.set(Math.max(1, bw / 4), Math.max(1, bh / 3));

        const mat = new THREE.MeshStandardMaterial({
          map: texCopy,
          bumpMap: wallTex.bumpMap,
          bumpScale: 0.24,
          roughness: 0.85,
          metalness: 0.08,
          color: w.isPitFloor ? 0x6f6482 : 0xffffff
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(toX(w.x + w.w / 2), toY(w.y + w.h / 2), 0);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        levelGroup.add(mesh);

        // Üst 3D taş pervaz (sadece normal platform üstleri)
        if (!w.isPitFloor && w.h <= 45) {
          const rim = new THREE.Mesh(
            new THREE.BoxGeometry(bw + 0.14, 0.34, bd + 0.3),
            new THREE.MeshStandardMaterial({ color: 0x7a6f8f, roughness: 0.72, metalness: 0.1 })
          );
          rim.position.set(toX(w.x + w.w / 2), toY(w.y) - 0.1, 0);
          rim.receiveShadow = true;
          levelGroup.add(rim);
        }
      }

      // 2. GERÇEKÇİ OYMA ÇUKUR HAVUZLAR (İç Yan Duvarlar + 3D Dalgalı Sıvı + Işık)
      for (const hz of lvl.hazards) {
        const hw = hz.w / S;
        const hDepth = hz.depth / S;
        const cx = toX(hz.x + hz.w / 2);
        const topY = toY(hz.y);

        // Çukurun karanlık arka duvarı ve eğimli taş ağız kenarları
        const backLip = new THREE.Mesh(
          new THREE.BoxGeometry(hw + 0.3, hDepth + 0.2, 0.5),
          new THREE.MeshStandardMaterial({ color: 0x1e1828, roughness: 0.95 })
        );
        backLip.position.set(cx, topY - hDepth / 2, -2.1);
        levelGroup.add(backLip);

        // Ön cam/taş düşük eşik (çukurun içindeki sıvıyı 3D derinlikli görmen için)
        const frontLip = new THREE.Mesh(
          new THREE.BoxGeometry(hw + 0.3, hDepth * 0.42, 0.45),
          new THREE.MeshStandardMaterial({ color: 0x4b4259, roughness: 0.8 })
        );
        frontLip.position.set(cx, topY - hDepth + hDepth * 0.21, 2.25);
        levelGroup.add(frontLip);

        // Sol ve sağ eğimli 3D taş havuz dudakları
        [-1, 1].forEach((side) => {
          const bevel = new THREE.Mesh(
            new THREE.BoxGeometry(0.45, hDepth * 0.9, 4.7),
            new THREE.MeshStandardMaterial({ color: 0x625673, roughness: 0.78 })
          );
          bevel.position.set(cx + side * (hw / 2 - 0.08), topY - hDepth * 0.48, 0);
          bevel.rotation.z = side * 0.28;
          levelGroup.add(bevel);
        });

        // Sıvı Materyali
        let liqColor = 0xff3d00, emCol = 0xff6d00, op = 0.96, lightCol = 0xff5722;
        if (hz.type === "water") { liqColor = 0x00b0ff; emCol = 0x0066aa; op = 0.84; lightCol = 0x29b6f6; }
        if (hz.type === "acid") { liqColor = 0x64dd17; emCol = 0x2e7d32; op = 0.92; lightCol = 0x76ff03; }

        // Çukur içi sıvı hacmi (taş yüzeyinin 0.28 birim altında!)
        const liqH = hDepth * 0.72;
        const bodyMesh = new THREE.Mesh(
          new THREE.BoxGeometry(hw - 0.12, liqH, 4.1),
          new THREE.MeshStandardMaterial({
            color: liqColor, emissive: emCol, emissiveIntensity: 0.75,
            roughness: 0.15, metalness: 0.1, transparent: true, opacity: op
          })
        );
        bodyMesh.position.set(cx, topY - hDepth + liqH / 2, 0);
        levelGroup.add(bodyMesh);

        // Dalgalanan 3D Üst Yüzey Mesh'i
        const surfGeo = new THREE.PlaneGeometry(hw - 0.1, 4.1, 12, 4);
        const surfMat = new THREE.MeshStandardMaterial({
          color: hz.type === "lava" ? 0xffd54f : (hz.type === "water" ? 0x80d8ff : 0xccff90),
          emissive: liqColor,
          emissiveIntensity: 0.9,
          roughness: 0.1,
          transparent: true,
          opacity: 0.92
        });
        const surfMesh = new THREE.Mesh(surfGeo, surfMat);
        surfMesh.rotation.x = -Math.PI / 2;
        surfMesh.position.set(cx, topY - hDepth + liqH + 0.03, 0);
        levelGroup.add(surfMesh);

        // Çukurdan yukarı vuran gerçek 3D ışık
        const pitLight = new THREE.PointLight(lightCol, 1.35, 13);
        pitLight.position.set(cx, topY + 1.2, 1.2);
        levelGroup.add(pitLight);

        dynLiquids.push({ surfGeo, hz, cx, topY, pitLight });
      }

      // 3. 3D Duvar Meşaleleri
      for (const t of lvl.torches) {
        const tg = new THREE.Group();
        tg.position.set(toX(t.x), toY(t.y), -3.8);

        const handle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.12, 1.8, 8),
          new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.9 })
        );
        handle.rotation.x = 0.25;
        tg.add(handle);

        const flame = new THREE.Mesh(
          new THREE.ConeGeometry(0.42, 1.15, 8),
          new THREE.MeshBasicMaterial({ color: 0xffab00 })
        );
        flame.position.set(0, 1.1, 0.22);
        tg.add(flame);

        const tLight = new THREE.PointLight(0xff8f2b, 1.4, 18);
        tLight.position.set(0, 1.4, 2.2);
        tg.add(tLight);

        levelGroup.add(tg);
        dynTorches.push({ flame, tLight, x: toX(t.x), y: toY(t.y) + 1.2, z: -3.4 });
      }

      // 4. 3D Mekanik Kapılar & Enerji Köprüleri
      for (const g of lvl.gates) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(g.w / S, g.h / S, 4.2),
          new THREE.MeshStandardMaterial({
            color: g.color, emissive: g.color, emissiveIntensity: 0.45,
            roughness: 0.3, metalness: 0.4, transparent: true, opacity: 0.95
          })
        );
        mesh.position.set(toX(g.x + g.w / 2), toY(g.y + g.h / 2), 0);
        mesh.castShadow = true;
        levelGroup.add(mesh);
        dynGates.push({ data: g, mesh });
      }

      // 5. 3D Zemin Butonları
      for (const b of lvl.buttons) {
        const base = new THREE.Mesh(
          new THREE.BoxGeometry((b.w + 6) / S, 0.35, 3.6),
          new THREE.MeshStandardMaterial({ color: 0x2a2335, roughness: 0.8 })
        );
        base.position.set(toX(b.x + b.w / 2), toY(b.y + b.h) + 0.17, 0);
        levelGroup.add(base);

        const cap = new THREE.Mesh(
          new THREE.BoxGeometry(b.w / S, 0.55, 3.0),
          new THREE.MeshStandardMaterial({ color: b.color, emissive: b.color, emissiveIntensity: 0.5, roughness: 0.3 })
        );
        const restY = toY(b.y + b.h / 2) + 0.1;
        cap.position.set(toX(b.x + b.w / 2), restY, 0);
        levelGroup.add(cap);
        dynButtons.push({ data: b, cap, restY });
      }

      // 6. 3D Dönen Kristal Elmaslar
      lvl.gems.forEach((gm, i) => {
        const isFire = gm.type === "fire";
        const col = isFire ? 0xff3d00 : 0x00b0ff;
        const mesh = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.92, 0),
          new THREE.MeshStandardMaterial({
            color: col, emissive: col, emissiveIntensity: 0.75,
            roughness: 0.1, metalness: 0.35
          })
        );
        mesh.scale.set(0.85, 1.25, 0.85);
        mesh.position.set(toX(gm.x), toY(gm.y), 0.2);
        levelGroup.add(mesh);
        dynGems.push({ mesh, baseY: toY(gm.y), idx: i });
      });

      // 7. 3D Tapınak Bitiş Kapıları
      ["fire", "water"].forEach((t) => {
        const d = lvl.doors[t];
        const col = t === "fire" ? 0xff5722 : 0x29b6f6;
        const dg = new THREE.Group();
        dg.position.set(toX(d.x + d.w / 2), toY(d.y + d.h / 2), -1.8);

        const frame = new THREE.Mesh(
          new THREE.BoxGeometry((d.w + 8) / S, (d.h + 4) / S, 1.6),
          new THREE.MeshStandardMaterial({ color: 0x453b54, roughness: 0.8 })
        );
        dg.add(frame);

        const portal = new THREE.Mesh(
          new THREE.BoxGeometry((d.w - 4) / S, (d.h - 4) / S, 1.8),
          new THREE.MeshStandardMaterial({ color: 0x100c18, emissive: col, emissiveIntensity: 0.25, roughness: 0.2 })
        );
        dg.add(portal);

        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(1.15, 0.16, 10, 24),
          new THREE.MeshBasicMaterial({ color: col })
        );
        ring.position.z = 1.05;
        dg.add(ring);

        levelGroup.add(dg);
        dynDoors[t] = { portal, ring, col };
      });
    }

    buildLevel3D(0);

    // =========================================================================
    // 5. OYUN DURUMU, FİZİK (COYOTE TIME + STEP-UP) & EŞLEŞME SİSTEMİ
    // =========================================================================
    let appScreen = "lobby"; // 'lobby' | 'game'
    let mode = "solo"; // 'host' | 'guest' | 'solo'
    let soloControl = "fire";
    let currentRoomCode = null;
    let roomRef = null;
    let heartbeatInt = null;
    let selectedStartLevel = 0;
    let guestReady = false;
    let gameStarted = false;
    let lastRestartReq = 0;
    let lastEventId = 0;

    let localInput = { left: false, right: false, jump: false };
    let remoteInput = { left: false, right: false, jump: false };

    const pExtra = {
      fire: { coyote: 0, jumpBuf: 0, walkPhase: 0, squashY: 1, wasGround: true },
      water: { coyote: 0, jumpBuf: 0, walkPhase: 0, squashY: 1, wasGround: true }
    };

    let state = {
      levelIdx: 0,
      fire: { x: 46, y: 382, vx: 0, vy: 0, grounded: false, dir: 1 },
      water: { x: 92, y: 382, vx: 0, vy: 0, grounded: false, dir: 1 },
      gemsCollected: [false, false, false, false],
      activeIds: {},
      event: { id: 0, type: "", text: "" }
    };

    // Misafir ekranda 60 FPS akıcı görünüm için interpolasyon konumu
    const smoothPos = {
      fire: { x: 46, y: 382 },
      water: { x: 92, y: 382 }
    };

    const statusBar = document.getElementById("statusBar");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;
    let levelLock = false;

    function setStatus(html) { statusBar.innerHTML = html; }
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function emitEvent(type, text) {
      state.event = { id: Date.now() + Math.random(), type, text };
      showToast(text);
      if (mode === "host" && roomRef && gameStarted) roomRef.child("state").set(state);
    }

    // --- SEKME GEÇİŞLERİ ---
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-pane").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.querySelectorAll(".lvl-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        if (mode !== "host") return;
        selectedStartLevel = Number(chip.dataset.lvl);
        document.querySelectorAll(".lvl-chip").forEach((c) => c.classList.remove("selected"));
        chip.classList.add("selected");
        if (roomRef) roomRef.update({ startLevel: selectedStartLevel });
      });
    });

    // --- CANLI AÇIK ODALAR DİNLEYİCİSİ (İndeks gerektirmez, eski odaları eler) ---
    let openRoomsCache = [];
    function startRoomBrowser() {
      if (!initFirebase()) return;
      db.ref(ROOMS_PATH).on("value", (snap) => {
        const now = Date.now();
        const list = [];
        snap.forEach((child) => {
          const r = child.val();
          if (!r) return;
          const alive = r.hostOnline && (now - (r.hostHeartbeat || 0) < 25000);
          if (r.isPublic && r.status === "waiting" && alive && !r.guestOnline) {
            list.push({ code: child.key, hostName: r.hostName || "Ateş", startLevel: r.startLevel || 0 });
          }
        });
        openRoomsCache = list;
        document.getElementById("openCountText").textContent = `${list.length} Açık Oda`;

        const el = document.getElementById("publicRoomList");
        if (!list.length) {
          el.innerHTML = '<div class="empty-list">Şu an bekleyen açık oda yok.<br>Aşağıdan sen açabilir veya Hızlı Eşleştir diyebilirsin.</div>';
        } else {
          el.innerHTML = "";
          list.forEach((item) => {
            const row = document.createElement("div");
            row.className = "room-item";
            row.innerHTML = `
              <div class="room-item-info">
                <div class="room-item-name">🔥 ${escapeHtml(item.hostName)}</div>
                <div class="room-item-sub">Oda #${item.code} • ${LEVELS[item.startLevel].name}</div>
              </div>
              <button class="btn-mini-join">💧 Katıl</button>
            `;
            row.querySelector("button").addEventListener("click", () => joinRoom(item.code));
            el.appendChild(row);
          });
        }
      });
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    startRoomBrowser();

    // --- ODA KUR / RASTGELE EŞLEŞTİR / KATIL ---
    async function createRoom(isPublic) {
      if (!initFirebase()) return;
      SoundFX.unlock();
      mode = "host";
      guestReady = false;
      gameStarted = false;
      selectedStartLevel = 0;

      setStatus('<span class="radar-spinner"></span>Oda kuruluyor...');
      const code = String(Math.floor(1000 + Math.random() * 9000));
      currentRoomCode = code;
      roomRef = db.ref(`${ROOMS_PATH}/${code}`);

      try {
        await roomRef.set({
          code,
          isPublic,
          status: "waiting",
          startLevel: 0,
          hostName: getNick(),
          hostOnline: true,
          hostHeartbeat: Date.now(),
          guestOnline: false,
          guestName: "",
          guestReady: false,
          guestInput: { left: false, right: false, jump: false },
          restartReq: 0
        });
        roomRef.onDisconnect().remove();

        clearInterval(heartbeatInt);
        heartbeatInt = setInterval(() => {
          if (roomRef && mode === "host") roomRef.child("hostHeartbeat").set(Date.now());
        }, 5000);

        openWaitingRoomUI(code, isPublic, true);
        attachHostListener();
      } catch (e) {
        setStatus("Oda açılamadı (Firebase Kurallarını kontrol et): " + e.message);
      }
    }

    async function quickMatch() {
      if (!initFirebase()) return;
      SoundFX.unlock();
      setStatus('<span class="radar-spinner"></span>Uygun oyuncu aranıyor...');
      try {
        const snap = await db.ref(ROOMS_PATH).once("value");
        const now = Date.now();
        let targetCode = null;
        snap.forEach((child) => {
          const r = child.val();
          if (r && r.isPublic && r.status === "waiting" && r.hostOnline && !r.guestOnline && (now - (r.hostHeartbeat || 0) < 25000)) {
            targetCode = child.key;
          }
        });
        if (targetCode) {
          await joinRoom(targetCode);
        } else {
          await createRoom(true);
          setStatus('<span class="radar-spinner"></span>Açık oda kuruldu! Rastgele oyuncu bekleniyor...');
        }
      } catch (e) {
        setStatus("Eşleştirme hatası: " + e.message);
      }
    }

    async function joinRoom(code) {
      if (!initFirebase()) return;
      SoundFX.unlock();
      code = String(code || "").trim();
      if (code.length !== 4) {
        setStatus("Lütfen 4 haneli oda kodunu gir.");
        return;
      }

      setStatus('<span class="radar-spinner"></span>Odaya bağlanılıyor...');
      const ref = db.ref(`${ROOMS_PATH}/${code}`);
      try {
        const snap = await ref.once("value");
        const data = snap.val();
        if (!data || !data.hostOnline || (Date.now() - (data.hostHeartbeat || 0) > 30000)) {
          setStatus("Bu koda ait aktif bir oda bulunamadı.");
          return;
        }
        // Çakışma olmaması için atomik koltuk rezervasyonu
        const tx = await ref.child("guestOnline").transaction((curr) => (curr ? undefined : true));
        if (!tx.committed) {
          setStatus("Bu oda şu anda dolu.");
          return;
        }

        mode = "guest";
        currentRoomCode = code;
        roomRef = ref;
        guestReady = false;
        gameStarted = false;
        lastEventId = 0;

        await roomRef.update({
          guestName: getNick(),
          guestReady: false,
          guestInput: { left: false, right: false, jump: false }
        });
        roomRef.child("guestOnline").onDisconnect().set(false);
        roomRef.child("guestReady").onDisconnect().set(false);
        roomRef.child("guestName").onDisconnect().set("");

        openWaitingRoomUI(code, !!data.isPublic, false);
        attachGuestListener();
      } catch (e) {
        setStatus("Bağlantı hatası: " + e.message);
      }
    }

    function openWaitingRoomUI(code, isPublic, isHost) {
      document.getElementById("menuCard").style.display = "none";
      document.getElementById("roomCard").style.display = "flex";
      document.getElementById("roomTypeLabel").textContent = isPublic ? "⚡ AÇIK EŞLEŞME ODASI" : "🔒 ÖZEL ODA";
      document.getElementById("roomCodeDisplay").textContent = code;
      document.getElementById("levelPickerWrap").style.display = isHost ? "flex" : "none";

      const btnStart = document.getElementById("btnStartGame");
      const btnReady = document.getElementById("btnToggleReady");
      if (isHost) {
        btnStart.style.display = "flex";
        btnStart.disabled = true;
        btnStart.textContent = "⏳ Su Oyuncusu Bekleniyor...";
        btnReady.style.display = "none";
        document.getElementById("fireName").textContent = getNick();
        setStatus("Su oyuncusu katılıp Hazır verince oyunu başlatabilirsin.");
      } else {
        btnStart.style.display = "none";
        btnReady.style.display = "flex";
        btnReady.className = "btn btn-ready-off";
        btnReady.textContent = "✋ Hazır Ver";
        setStatus("Odaya katıldın! Kurucunun başlatması için Hazır Ver.");
      }
    }

    function attachHostListener() {
      roomRef.on("value", (snap) => {
        const d = snap.val();
        if (!d) return;

        const wCard = document.getElementById("slotWater");
        const wName = document.getElementById("waterName");
        const wBadge = document.getElementById("waterBadge");
        const btnStart = document.getElementById("btnStartGame");

        if (d.guestOnline) {
          wCard.classList.add("water-on");
          wName.textContent = d.guestName || "Su Oyuncusu";
          if (d.guestReady) {
            wBadge.textContent = "✅ Hazır!";
            wBadge.className = "slot-badge ready";
            btnStart.disabled = false;
            btnStart.textContent = "🚀 Oyunu Başlat";
            if (!gameStarted) setStatus("İkiniz de hazırsınız! Oyunu Başlat butonuna bas.");
          } else {
            wBadge.textContent = "Hazırlanıyor...";
            wBadge.className = "slot-badge";
            btnStart.disabled = true;
            btnStart.textContent = "⏳ Su Hazır Bekleniyor...";
            if (!gameStarted) setStatus(`${d.guestName || "Su"} odaya girdi, hazır vermesi bekleniyor.`);
          }
        } else {
          wCard.classList.remove("water-on");
          wName.textContent = "Bekleniyor...";
          wBadge.textContent = "Boş";
          wBadge.className = "slot-badge";
          btnStart.disabled = true;
          btnStart.textContent = "⏳ Su Oyuncusu Bekleniyor...";
          if (gameStarted) showToast("Su oyuncusu oyundan çıktı!");
        }

        if (d.guestInput) remoteInput = d.guestInput;
        if (gameStarted && d.restartReq && d.restartReq !== lastRestartReq) {
          lastRestartReq = d.restartReq;
          loadLevel(state.levelIdx);
        }
      });
    }

    function attachGuestListener() {
      roomRef.on("value", (snap) => {
        const d = snap.val();
        if (!d || !d.hostOnline) {
          leaveRoom();
          setStatus("Kurucu odayı kapattı.");
          return;
        }
        document.getElementById("fireName").textContent = d.hostName || "Ateş";
        const wCard = document.getElementById("slotWater");
        wCard.classList.add("water-on");
        document.getElementById("waterName").textContent = getNick();
        const wBadge = document.getElementById("waterBadge");
        wBadge.textContent = d.guestReady ? "✅ Hazır!" : "Hazır Değil";
        wBadge.className = d.guestReady ? "slot-badge ready" : "slot-badge";

        if (d.status === "playing" && !gameStarted) {
          gameStarted = true;
          SoundFX.win();
          enterGameScreen(d.startLevel || 0);
        }

        if (gameStarted && d.state) {
          const prevLvl = state.levelIdx;
          const prevGems = state.gemsCollected || [];
          const prevActive = state.activeIds || {};
          const prevF = { ...state.fire }, prevW = { ...state.water };

          const ns = d.state;
          ns.gemsCollected = ns.gemsCollected || [];
          ns.activeIds = ns.activeIds || {};

          if (ns.levelIdx !== prevLvl) {
            buildLevel3D(ns.levelIdx);
            smoothPos.fire = { x: ns.fire.x, y: ns.fire.y };
            smoothPos.water = { x: ns.water.x, y: ns.water.y };
            showToast(LEVELS[ns.levelIdx].name);
          } else {
            ns.gemsCollected.forEach((col, idx) => {
              if (col && !prevGems[idx]) {
                const gm = LEVELS[ns.levelIdx].gems[idx];
                burst3D(gm.x, gm.y, gm.type === "fire" ? [0xff5252, 0xffd54f] : [0x40c4ff, 0xffffff], 18);
                SoundFX.gem();
              }
            });
            const gateChanged = Object.keys({ ...prevActive, ...ns.activeIds }).some((k) => !!prevActive[k] !== !!ns.activeIds[k]);
            if (gateChanged) SoundFX.door(true);
          }

          if (ns.event && ns.event.id && ns.event.id !== lastEventId) {
            lastEventId = ns.event.id;
            if (ns.event.text) showToast(ns.event.text);
            if (ns.event.type === "death_fire") {
              burst3D(prevF.x + PW / 2, prevF.y + PH / 2, [0xcfd8dc, 0xff8a65], 20);
              SoundFX.death();
            } else if (ns.event.type === "death_water") {
              burst3D(prevW.x + PW / 2, prevW.y + PH / 2, [0xe1f5fe, 0x80d8ff], 20);
              SoundFX.death();
            } else if (ns.event.type === "win") {
              SoundFX.win();
            }
          }

          state = ns;
          updateHud();
        }
      });
    }

    async function leaveRoom() {
      clearInterval(heartbeatInt);
      if (roomRef) {
        roomRef.off();
        if (mode === "host") await roomRef.remove();
        else if (mode === "guest") await roomRef.update({ guestOnline: false, guestReady: false, guestName: "" });
        roomRef = null;
      }
      currentRoomCode = null;
      gameStarted = false;
      guestReady = false;
      appScreen = "lobby";

      document.getElementById("lobbyOverlay").style.display = "flex";
      document.getElementById("roomCard").style.display = "none";
      document.getElementById("menuCard").style.display = "flex";
      buildLevel3D(0);
      setStatus("Ana menüdesin.");
    }

    // Lobi Butonları
    document.getElementById("btnQuickMatch").addEventListener("click", quickMatch);
    document.getElementById("btnCreatePublic").addEventListener("click", () => createRoom(true));
    document.getElementById("btnCreatePrivate").addEventListener("click", () => createRoom(false));
    document.getElementById("btnJoinCode").addEventListener("click", () => joinRoom(document.getElementById("inputCode").value));
    document.getElementById("btnLeaveRoom").addEventListener("click", leaveRoom);
    document.getElementById("btnExitGame").addEventListener("click", leaveRoom);

    document.getElementById("btnShareLink").addEventListener("click", async () => {
      const url = `${location.origin}${location.pathname}?oda=${currentRoomCode}`;
      try {
        if (navigator.share) {

      }
    });

    document.getElementById("btnToggleReady").addEventListener("click", async () => {
      if (!roomRef || mode !== "guest") return;
      guestReady = !guestReady;
      SoundFX.ready();
      const b = document.getElementById("btnToggleReady");
      b.className = guestReady ? "btn btn-ready-on" : "btn btn-ready-off";
      b.textContent = guestReady ? "✅ Hazırsın (Kurucu Bekleniyor)" : "✋ Hazır Ver";

    document.getElementById("btnStartGame").addEventListener("click", async () => {
      if (!roomRef || mode !== "host") return;
      SoundFX.win();
      gameStarted = true;
      loadLevel(selectedStartLevel);
      await roomRef.update({ status: "playing", isPublic: false, state });

    });

    document.getElementById("btnSolo").addEventListener("click", () => {
      SoundFX.unlock();
      mode = "solo";
      gameStarted = true;
      loadLevel(0);
      enterGameScreen(0);
    });

    function enterGameScreen(lvlIdx) {
      appScreen = "game";
      document.getElementById("lobbyOverlay").style.display = "none";
      document.getElementById("gameHudOverlay").style.display = "flex";
      const pill = document.getElementById("rolePill");
      const sw = document.getElementById("btnSwitch");
      if (mode === "host") {
        pill.textContent = "🔥 Ateş"; pill.className = "hud-pill fire"; sw.style.display = "none";
      } else if (mode === "guest") {
        pill.textContent = "💧 Su"; pill.className = "hud-pill water"; sw.style.display = "none";
      } else {
        pill.textContent = "🔥 Ateş (Solo)"; pill.className = "hud-pill fire"; sw.style.display = "flex";
      }
      buildLevel3D(lvlIdx);
      updateHud();

    function loadLevel(idx) {
      const lvl = CARVED_LEVELS[idx];
      state.levelIdx = idx;
      state.fire = { x: lvl.spawns.fire.x, y: lvl.spawns.fire.y, vx: 0, vy: 0, grounded: false, dir: 1 };
      state.water = { x: lvl.spawns.water.x, y: lvl.spawns.water.y, vx: 0, vy: 0, grounded: false, dir: 1 };
      smoothPos.fire = { x: lvl.spawns.fire.x, y: lvl.spawns.fire.y };
      smoothPos.water = { x: lvl.spawns.water.x, y: lvl.spawns.water.y };
      state.gemsCollected = lvl.gems.map(() => false);
      state.activeIds = {};
      levelLock = false;
      buildLevel3D(idx);
      updateHud();
      showToast(lvl.name);
      if (mode === "host" && roomRef && gameStarted) roomRef.child("state").set(state);
    }

    function updateHud() {
      const lvl = LEVELS[state.levelIdx];
      document.getElementById("levelPill").textContent = lvl.name;
      const got = (state.gemsCollected || []).filter(Boolean).length;
      document.getElementById("gemPill").textContent = `💎 ${got}/${lvl.gems.length}`;
    }

    document.getElementById("btnMute").addEventListener("click", (e) => {
      SoundFX.muted = !SoundFX.muted;
      e.target.textContent = SoundFX.muted ? "🔇" : "🔊";
    });
    document.getElementById("btnRestart").addEventListener("click", () => {
      if (mode === "guest" && roomRef) roomRef.child("restartReq").set(Date.now());
      else loadLevel(state.levelIdx);
    });
    document.getElementById("btnSwitch").addEventListener("click", () => {
      soloControl = soloControl === "fire" ? "water" : "fire";
      const pill = document.getElementById("rolePill");
      pill.textContent = soloControl === "fire" ? "🔥 Ateş (Solo)" : "💧 Su (Solo)";
      pill.className = soloControl === "fire" ? "hud-pill fire" : "hud-pill water";
    });

    // =========================================================================
    // 6. KESİNTİSİZ MULTI-TOUCH KONTROLLERİ (Kaydırmalı D-Pad + Bağımsız Zıpla)
    // =========================================================================
    function syncGuestInput() {
      if (mode === "guest" && roomRef && gameStarted) {
        roomRef.child("guestInput").set(localInput);
      }
    }

    const dpadPad = document.getElementById("dpadPad");
    const visLeft = document.getElementById("visualLeft");
    const visRight = document.getElementById("visualRight");
    const btnJump = document.getElementById("btnJump");

    function setDirFromClientX(clientX) {
      const rect = dpadPad.getBoundingClientRect();
      const isLeft = clientX < rect.left + rect.width / 2;
      const changed = localInput.left !== isLeft || localInput.right !== !isLeft;
      localInput.left = isLeft;
      localInput.right = !isLeft;
      visLeft.classList.toggle("active", isLeft);
      visRight.classList.toggle("active", !isLeft);
      if (changed) syncGuestInput();
    }

    function clearDir() {
      if (localInput.left || localInput.right) {
        localInput.left = false;
        localInput.right = false;
        visLeft.classList.remove("active");
        visRight.classList.remove("active");
        syncGuestInput();
      }
    }

    let dpadTouchId = null;
    dpadPad.addEventListener("touchstart", (e) => {
      e.preventDefault();
      SoundFX.unlock();
      const t = e.changedTouches[0];
      dpadTouchId = t.identifier;
      setDirFromClientX(t.clientX);
    }, { passive: false });

    dpadPad.addEventListener("touchmove", (e) => {
      e.preventDefault();
      for (const t of e.touches) {
        if (t.identifier === dpadTouchId) setDirFromClientX(t.clientX);
      }
    }, { passive: false });

    dpadPad.addEventListener("touchend", (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === dpadTouchId) { dpadTouchId = null; clearDir(); }
      }
    }, { passive: false });
    dpadPad.addEventListener("touchcancel", () => { dpadTouchId = null; clearDir(); });

    // Masaüstü fare desteği
    let mouseDpad = false;
    dpadPad.addEventListener("mousedown", (e) => { mouseDpad = true; setDirFromClientX(e.clientX); });
    window.addEventListener("mousemove", (e) => { if (mouseDpad) setDirFromClientX(e.clientX); });
    window.addEventListener("mouseup", () => { if (mouseDpad) { mouseDpad = false; clearDir(); } });

    // Zıplama Butonu (Sol elden %100 bağımsız)
    function setJump(down) {
      if (localInput.jump !== down) {
        localInput.jump = down;
        btnJump.classList.toggle("active", down);
        syncGuestInput();
      }
    }
    btnJump.addEventListener("touchstart", (e) => { e.preventDefault(); SoundFX.unlock(); setJump(true); }, { passive: false });
    btnJump.addEventListener("touchend", (e) => { e.preventDefault(); setJump(false); }, { passive: false });
    btnJump.addEventListener("touchcancel", () => setJump(false));
    btnJump.addEventListener("mousedown", () => setJump(true));
    btnJump.addEventListener("mouseup", () => setJump(false));
    btnJump.addEventListener("mouseleave", () => setJump(false));

    // Klavye Desteği
    window.addEventListener("keydown", (e) => {
      if (document.activeElement === nickInput || document.activeElement === document.getElementById("inputCode")) return;
      SoundFX.unlock();
      let ch = false;
      if ((e.code === "ArrowLeft" || e.code === "KeyA") && !localInput.left) { localInput.left = true; ch = true; }
      if ((e.code === "ArrowRight" || e.code === "KeyD") && !localInput.right) { localInput.right = true; ch = true; }
      if ((e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") && !localInput.jump) { localInput.jump = true; ch = true; }
      if (e.code === "Tab" && mode === "solo") { e.preventDefault(); document.getElementById("btnSwitch").click(); }
      if (ch) syncGuestInput();
    });
    window.addEventListener("keyup", (e) => {
      let ch = false;
      if (e.code === "ArrowLeft" || e.code === "KeyA") { localInput.left = false; ch = true; }
      if (e.code === "ArrowRight" || e.code === "KeyD") { localInput.right = false; ch = true; }
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") { localInput.jump = false; ch = true; }
      if (ch) syncGuestInput();
    });

    // =========================================================================
    // 7. FİZİK SİMÜLASYONU (Gerçek Çukur Girişi + Step-Up + Coyote Time)
    // =========================================================================
    function overlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function getSolids(lvl) {
      const s = [...lvl.carvedWalls];
      for (const g of lvl.gates) {
        const active = !!(state.activeIds && state.activeIds[g.id]);
        if (g.kind === "gate" && !active) s.push(g);
        if (g.kind === "bridge" && active) s.push(g);
      }
      return s;
    }

    function movePlayer(p, ex, input, solids, dt, isFire) {
      if (input.left && !input.right) { p.vx = -MOVE_SPEED; p.dir = -1; }
      else if (input.right && !input.left) { p.vx = MOVE_SPEED; p.dir = 1; }
      else p.vx = 0;

      // Coyote Time & Jump Buffer
      if (p.grounded) ex.coyote = 7.5;
      else ex.coyote = Math.max(0, ex.coyote - dt);

      if (input.jump) ex.jumpBuf = 8.5;
      else ex.jumpBuf = Math.max(0, ex.jumpBuf - dt);

      if (ex.jumpBuf > 0 && ex.coyote > 0) {
        p.vy = JUMP_FORCE;
        p.grounded = false;
        ex.coyote = 0;
        ex.jumpBuf = 0;
        ex.squashY = 1.24;
        SoundFX.jump(isFire);
      }

      p.vy = Math.min(p.vy + GRAVITY * dt, 14);

      // Yatay hareket + Çukurdan yumuşak basamak çıkışı (step-up <= 12px)
      p.x += p.vx * dt;
      for (const s of solids) {
        if (overlap({ x: p.x, y: p.y, w: PW, h: PH }, s)) {
          const stepHeight = (p.y + PH) - s.y;
          if (stepHeight > 0 && stepHeight <= 12.5 && p.vy >= -2) {
            // Çukur kenarından rahatça yukarı çık
            const testY = s.y - PH;
            const blocked = solids.some((o) => o !== s && overlap({ x: p.x, y: testY, w: PW, h: PH }, o));
            if (!blocked) {
              p.y = testY;
              continue;
            }
          }
          if (p.vx > 0) p.x = s.x - PW;
          else if (p.vx < 0) p.x = s.x + s.w;
        }
      }

      // Dikey hareket
      p.y += p.vy * dt;
      p.grounded = false;
      for (const s of solids) {
        if (overlap({ x: p.x, y: p.y, w: PW, h: PH }, s)) {
          if (p.vy > 0) {
            p.y = s.y - PH;
            p.vy = 0;
            p.grounded = true;
          } else if (p.vy < 0) {
            p.y = s.y + s.h;
            p.vy = 0;
          }
        }
      }
    }

    function stepPhysics(dt) {
      const lvl = CARVED_LEVELS[state.levelIdx];

      const prevAct = state.activeIds || {};
      const act = {};
      const fBox = { x: state.fire.x, y: state.fire.y, w: PW, h: PH };
      const wBox = { x: state.water.x, y: state.water.y, w: PW, h: PH };
      for (const b of lvl.buttons) {
        const bb = { x: b.x, y: b.y - 4, w: b.w, h: b.h + 4 };
        if (overlap(fBox, bb) || overlap(wBox, bb)) act[b.targetId] = true;
      }
      const keys = new Set([...Object.keys(prevAct), ...Object.keys(act)]);
      for (const k of keys) {
        if (!!prevAct[k] !== !!act[k]) SoundFX.door(!!act[k]);
      }
      state.activeIds = act;

      const solids = getSolids(lvl);
      const empty = { left: false, right: false, jump: false };
      let fIn = localInput, wIn = remoteInput;
      if (mode === "solo") {
        fIn = soloControl === "fire" ? localInput : empty;
        wIn = soloControl === "water" ? localInput : empty;
      }

      movePlayer(state.fire, pExtra.fire, fIn, solids, dt, true);
      movePlayer(state.water, pExtra.water, wIn, solids, dt, false);

      // Çukur içi sıvı teması (sadece ayak gerçekten çukur sıvısının içine girerse!)
      const fFootX = state.fire.x + PW / 2, fFootY = state.fire.y + PH;
      const wFootX = state.water.x + PW / 2, wFootY = state.water.y + PH;

      for (const hz of lvl.hazards) {
        const inFirePit = fFootX > hz.x + 5 && fFootX < hz.x + hz.w - 5 && fFootY > hz.y + 3 && fFootY <= hz.y + hz.depth + 6;
        if (inFirePit && (hz.type === "water" || hz.type === "acid")) {
          burst3D(fFootX, fFootY - 12, [0xcfd8dc, 0xff8a65], 22);
          SoundFX.death();
          emitEvent("death_fire", "Ateş söndü! Bölüm yenileniyor...");
          loadLevel(state.levelIdx);
          return;
        }
        const inWaterPit = wFootX > hz.x + 5 && wFootX < hz.x + hz.w - 5 && wFootY > hz.y + 3 && wFootY <= hz.y + hz.depth + 6;
        if (inWaterPit && (hz.type === "lava" || hz.type === "acid")) {
          burst3D(wFootX, wFootY - 12, [0xe1f5fe, 0x80d8ff], 22);
          SoundFX.death();
          emitEvent("death_water", "Su buharlaştı! Bölüm yenileniyor...");
          loadLevel(state.levelIdx);
          return;
        }
      }

      // Elmas toplama
      let gemGot = false;
      lvl.gems.forEach((gm, i) => {
        if (state.gemsCollected[i]) return;
        const gb = { x: gm.x - 13, y: gm.y - 13, w: 26, h: 26 };
        if (gm.type === "fire" && overlap(fBox, gb)) {
          state.gemsCollected[i] = true;
          burst3D(gm.x, gm.y, [0xff5252, 0xffd54f], 18);
          SoundFX.gem();
          gemGot = true;
        }
        if (gm.type === "water" && overlap(wBox, gb)) {
          state.gemsCollected[i] = true;
          burst3D(gm.x, gm.y, [0x40c4ff, 0xffffff], 18);
          SoundFX.gem();
          gemGot = true;
        }
      });
      if (gemGot) updateHud();

      // Kapı bitişi
      if (overlap(fBox, lvl.doors.fire) && overlap(wBox, lvl.doors.water) && !levelLock) {
        levelLock = true;
        SoundFX.win();
        burst3D(lvl.doors.fire.x + 20, lvl.doors.fire.y + 25, [0xff5722, 0xffd54f], 20);
        burst3D(lvl.doors.water.x + 20, lvl.doors.water.y + 25, [0x29b6f6, 0xffffff], 20);
        if (state.levelIdx + 1 < LEVELS.length) {
          emitEvent("win", "Harika! Sonraki 3D bölüme geçiliyor...");
          setTimeout(() => loadLevel(state.levelIdx + 1), 950);
        } else {
          emitEvent("win", "🎉 Tebrikler! Tüm 3D Tapınağı bitirdiniz!");
          setTimeout(() => loadLevel(0), 2500);
        }
      }
    }

    // =========================================================================
    // 8. 3D ANİMASYON VE RENDER DÖNGÜSÜ
    // =========================================================================
    let lastTime = performance.now();
    let syncTimer = 0;
    let tick = 0;

    function animateCharacterRig(rig, p, pos, ex, dt, isFire) {
      const moving = Math.abs(p.vx) > 0.25 && p.grounded;
      if (moving) ex.walkPhase += 0.34 * dt;
      else ex.walkPhase *= Math.pow(0.84, dt);

      if (p.grounded && !ex.wasGround) ex.squashY = 0.78;
      if (!p.grounded && ex.wasGround && p.vy < -2) {
        ex.squashY = 1.22;
        if (mode === "guest") SoundFX.jump(isFire);
      }
      ex.wasGround = p.grounded;
      ex.squashY += (1 - ex.squashY) * 0.2 * dt;

      rig.group.position.set(toX(pos.x + PW / 2), toY(pos.y + PH), 0);
      rig.bodyPivot.scale.set(1 / Math.sqrt(ex.squashY), ex.squashY, 1 / Math.sqrt(ex.squashY));
      rig.bodyPivot.rotation.y += ((p.dir > 0 ? 0.36 : -0.36) - rig.bodyPivot.rotation.y) * 0.22 * dt;

      const sw = moving ? Math.sin(ex.walkPhase) * 0.75 : (!p.grounded ? 0.35 : 0);
      rig.leftLeg.rotation.x = sw;
      rig.rightLeg.rotation.x = -sw;
      rig.leftArm.rotation.x = -sw * 0.85;
      rig.rightArm.rotation.x = sw * 0.85;
      rig.hairGroup.rotation.z = -p.vx * 0.05 + Math.sin(tick * 5 + (isFire ? 0 : 2)) * 0.08;

      // Element parçacıkları
      if (Math.random() < (moving ? 0.35 : 0.14)) {
        spawnP3D(
          rig.group.position.x + (Math.random() - 0.5) * 0.9,
          rig.group.position.y + 2.4 + Math.random() * 1.1,
          (Math.random() - 0.5) * 0.8,
          (Math.random() - 0.5) * 0.04,
          isFire ? 0.06 + Math.random() * 0.06 : -0.02 + Math.random() * 0.04,
          (Math.random() - 0.5) * 0.04,
          isFire ? (Math.random() < 0.5 ? 0xffd54f : 0xff5722) : 0x80d8ff,
          20, 0.75, 0
        );
      }
    }

    function loop(now) {
      const dtMs = now - lastTime;
      lastTime = now;
      const dt = Math.min(dtMs / 16.667, 2);
      tick += 0.05 * dt;

      if (appScreen === "game") {
        if (mode === "host" || mode === "solo") {
          stepPhysics(dt);
          smoothPos.fire = { x: state.fire.x, y: state.fire.y };
          smoothPos.water = { x: state.water.x, y: state.water.y };
          syncTimer += dtMs;
          if (mode === "host" && roomRef && gameStarted && syncTimer >= 42) {
            syncTimer = 0;
            roomRef.child("state").set(state);
          }
        } else {
          // Misafir pürüzsüz 60 FPS interpolasyon
          smoothPos.fire.x += (state.fire.x - smoothPos.fire.x) * 0.38;
          smoothPos.fire.y += (state.fire.y - smoothPos.fire.y) * 0.38;
          smoothPos.water.x += (state.water.x - smoothPos.water.x) * 0.38;
          smoothPos.water.y += (state.water.y - smoothPos.water.y) * 0.38;
        }

        // Dinamik 3D Kamera (Hafif 3 boyutlu paralaks açısı + tam harita görünümü)
        const aspect = window.innerWidth / window.innerHeight;
        const baseZ = aspect < 1.3 ? 105 : 73;
        const midX = toX((smoothPos.fire.x + smoothPos.water.x) / 2);
        const midY = toY((smoothPos.fire.y + smoothPos.water.y) / 2);
        camera.position.x += (midX * 0.14 - camera.position.x) * 0.06;
        camera.position.y += (midY * 0.12 + 1.8 - camera.position.y) * 0.06;
        camera.position.z += (baseZ - camera.position.z) * 0.08;
        camera.lookAt(midX * 0.05, midY * 0.04, 0);
      } else {
        // CANLI 3D ANA MENÜ KAMERASI (Tapınağın içinde sinematik gezinme)
        smoothPos.fire = { x: 205, y: 386 };
        smoothPos.water = { x: 468, y: 386 };
        state.fire.vx = 0; state.fire.grounded = true; state.fire.dir = 1;
        state.water.vx = 0; state.water.grounded = true; state.water.dir = -1;
        camera.position.set(Math.sin(tick * 0.25) * 14, -7.5 + Math.cos(tick * 0.2) * 1.6, 36);
        camera.lookAt(0, -14.5, 0);
      }

      // 3D Karakterleri Güncelle
      animateCharacterRig(fireRig, state.fire, smoothPos.fire, pExtra.fire, dt, true);
      animateCharacterRig(waterRig, state.water, smoothPos.water, pExtra.water, dt, false);

      // 3D Dalgalı Çukur Sıvıları ve Kabarcıkları
      for (const l of dynLiquids) {
        const posAttr = l.surfGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
          const vx = posAttr.getX(i), vy = posAttr.getY(i);
          posAttr.setZ(i, Math.sin(tick * 3.2 + vx * 1.4 + vy) * 0.12);
        }
        posAttr.needsUpdate = true;
        l.pitLight.intensity = 1.2 + Math.sin(tick * 4 + l.cx) * 0.25;

        if (Math.random() < 0.14) {
          const col = l.hz.type === "lava" ? 0xffab40 : (l.hz.type === "water" ? 0xb3e5fc : 0xb2ff59);
          spawnP3D(
            l.cx + (Math.random() - 0.5) * (l.hz.w / S - 0.6),
            l.topY - 0.3,
            (Math.random() - 0.5) * 3.0,
            (Math.random() - 0.5) * 0.03,
            0.06 + Math.random() * 0.08,
            (Math.random() - 0.5) * 0.03,
            col, 24, 0.72, -0.001
          );
        }
      }

      // Meşaleler
      dynTorches.forEach((t, i) => {
        const f = 1 + Math.sin(tick * 7 + i * 2) * 0.2;
        t.flame.scale.set(1, f, 1);
        t.tLight.intensity = 1.3 + Math.sin(tick * 8 + i) * 0.28;
        if (Math.random() < 0.1) {
          spawnP3D(t.x, t.y, t.z, (Math.random() - 0.5) * 0.03, 0.07, 0, 0xffca28, 22, 0.55, 0);
        }
      });

      // Kapılar, Butonlar ve Elmaslar
      for (const g of dynGates) {
        const on = !!(state.activeIds && state.activeIds[g.data.id]);
        if (g.data.kind === "gate") {
          g.mesh.visible = !on;
        } else {
          g.mesh.material.opacity = on ? 0.95 : 0.14;
        }
      }

      for (const b of dynButtons) {
        const on = !!(state.activeIds && state.activeIds[b.data.targetId]);
        b.cap.position.y = on ? b.restY - 0.32 : b.restY;
        b.cap.material.emissiveIntensity = on ? 1.2 : 0.4;
      }

      for (const gm of dynGems) {
        const collected = !!(state.gemsCollected && state.gemsCollected[gm.idx]);
        gm.mesh.visible = !collected;
        if (!collected) {
          gm.mesh.rotation.y += 0.045 * dt;
          gm.mesh.position.y = gm.baseY + Math.sin(tick * 1.8 + gm.idx) * 0.38;
        }
      }

      const lvl = CARVED_LEVELS[state.levelIdx];
      const fAtDoor = overlap({ x: state.fire.x, y: state.fire.y, w: PW, h: PH }, lvl.doors.fire);
      const wAtDoor = overlap({ x: state.water.x, y: state.water.y, w: PW, h: PH }, lvl.doors.water);
      if (dynDoors.fire) {
        dynDoors.fire.portal.material.emissiveIntensity = fAtDoor ? 1.3 : 0.25;
        dynDoors.fire.ring.rotation.z += 0.03 * dt;
      }
      if (dynDoors.water) {
        dynDoors.water.portal.material.emissiveIntensity = wAtDoor ? 1.3 : 0.25;
        dynDoors.water.ring.rotation.z -= 0.03 * dt;
      }

      // 3D Parçacıkları Güncelle
      for (let i = particles3D.length - 1; i >= 0; i--) {
        const p = particles3D[i];
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        p.vy += p.grav * dt;
        p.life -= dt;
        const ratio = Math.max(0, p.life / p.maxLife);
        p.mesh.material.opacity = ratio;
        p.mesh.scale.setScalar(p.scale * ratio);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles3D.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    // URL'de ?oda=1234 varsa doğrudan odaya katıl
    const inviteCode = new URLSearchParams(location.search).get("oda");
    if (inviteCode && inviteCode.length === 4) {
      setTimeout(() => joinRoom(inviteCode), 400);
    }
  </script>
</body>
</html>
