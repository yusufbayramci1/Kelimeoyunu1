<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seri Bağlantı</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #0a84ff; --danger: #ff453a; --text: #f5f5f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; overscroll-behavior: none; }
        h1 { font-size: 24px; margin-bottom: 10px; text-align: center; }
        .board { background: var(--surface); width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }
        .word-display { font-size: 32px; font-weight: bold; letter-spacing: 2px; color: var(--primary); margin: 20px 0; min-height: 40px; }
        .timer { font-size: 48px; font-weight: 800; color: var(--danger); margin: 15px 0; }
        input { width: 90%; padding: 15px; font-size: 18px; border-radius: 12px; border: none; outline: none; text-align: center; text-transform: uppercase; font-weight: bold; background: #2c2c2e; color: white; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.96); }
        .stats { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; color: #8e8e93; }
        .status { margin-top: 15px; font-size: 14px; color: #ff9f0a; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <h1>Seri Bağlantı</h1>
    
    <div class="board" id="loginBoard">
        <p>Oyuna giriş yap:</p>
        <button onclick="joinGame('Yusuf')" style="margin-bottom:10px;">Yusuf Olarak Katıl</button>
        <button onclick="joinGame('Yaren')" style="background:#ff375f;">Yaren Olarak Katıl</button>
    </div>

    <div class="board" id="gameBoard" style="display: none;">
        <div class="stats">
            <span id="playerYusuf">Yusuf Ceza: 0 (Güç: 2)</span>
            <span id="playerYaren">Yaren Ceza: 0 (Güç: 2)</span>
        </div>
        <div class="timer" id="timer">10</div>
        <div class="word-display" id="currentWord">BAŞLA</div>
        <input type="text" id="wordInput" placeholder="KELİME YAZ..." autocomplete="off">
        <button onclick="sendWord()">GÖNDER</button>
        <div class="status" id="statusMessage">Rakip bekleniyor...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCV8vsi4zIZbMQyBqyrbnu6liJkyTk_rcI",
            authDomain: "kelimeoyunu-9c9c2.firebaseapp.com",
            databaseURL: "https://kelimeoyunu-9c9c2-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kelimeoyunu-9c9c2",
            storageBucket: "kelimeoyunu-9c9c2.firebasestorage.app",
            messagingSenderId: "1081194409058",
            appId: "1:1081194409058:web:2abf3c249fc3f66d31b53b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let myPlayer = "";
        let countdown;

        function joinGame(player) {
            myPlayer = player;
            document.getElementById('loginBoard').style.display = 'none';
            document.getElementById('gameBoard').style.display = 'block';
            
            db.ref('game').on('value', (snapshot) => {
                const data = snapshot.val();
                if(!data) {
                    db.ref('game').set({
                        currentWord: "REKABET", turn: "Yusuf", timer: 10,
                        yusufPenalty: 0, yarenPenalty: 0, 
                        status: "Sıra Yusuf'ta (T ile başla)"
                    });
                } else {
                    updateUI(data);
                }
            });
        }

        function updateUI(data) {
            document.getElementById('currentWord').innerText = data.currentWord;
            document.getElementById('timer').innerText = data.timer;
            document.getElementById('playerYusuf').innerText = `Yusuf Ceza: ${data.yusufPenalty} (Güç: 2)`;
            document.getElementById('playerYaren').innerText = `Yaren Ceza: ${data.yarenPenalty} (Güç: 2)`;
            document.getElementById('statusMessage').innerText = data.status;

            const input = document.getElementById('wordInput');
            if(data.turn === myPlayer && data.yusufPenalty < 5 && data.yarenPenalty < 5) {
                input.disabled = false;
                if(data.timer === 10) startLocalTimer();
            } else {
                input.disabled = true;
                clearInterval(countdown);
            }

            if(data.yusufPenalty >= 5) document.getElementById('statusMessage').innerText = "YUSUF KAYBETTI! Ceza: Çikolatalı Islak Kek.";
            if(data.yarenPenalty >= 5) document.getElementById('statusMessage').innerText = "YAREN KAYBETTI! Ceza: Popeyes Çıtır Tavuk.";
        }

        function startLocalTimer() {
            clearInterval(countdown);
            let timeLeft = 10;
            countdown = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    if(myPlayer === "Yusuf") db.ref('game/yusufPenalty').set(firebase.database.ServerValue.increment(1));
                    if(myPlayer === "Yaren") db.ref('game/yarenPenalty').set(firebase.database.ServerValue.increment(1));
                    db.ref('game').update({ turn: myPlayer === "Yusuf" ? "Yaren" : "Yusuf", timer: 10 });
                }
            }, 1000);
        }

        function sendWord() {
            const word = document.getElementById('wordInput').value.trim().toUpperCase();
            document.getElementById('wordInput').value = "";
            const current = document.getElementById('currentWord').innerText;
            const expectedLetter = current.slice(-1);

            if(!word.startsWith(expectedLetter)) {
                alert(`HATA! Kelime ${expectedLetter} ile başlamalı.`);
                return;
            }

            clearInterval(countdown);
            let nextTurn = myPlayer === "Yusuf" ? "Yaren" : "Yusuf";
            
            db.ref('game').update({
                currentWord: word,
                turn: nextTurn,
                timer: 10,
                status: `Sıra ${nextTurn}'ta (${word.slice(-1)} ile başla)`
            });
        }
    </script>
</body>
</html>
